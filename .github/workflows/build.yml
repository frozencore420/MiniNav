# Builds the firmware on every push and pull request, and attaches the flashable .bin files as downloads.
# Each .bin is a merged image (bootloader + partition table + app) to flash at address 0x0.
name: build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4

      - name: Fetch LovyanGFX (display library, not kept in git)
        run: sh tools/fetch_lovyangfx.sh

      - name: Build touch version
        run: |
          . $IDF_PATH/export.sh
          rm -rf build sdkconfig
          idf.py build
          cd build && python3 -m esptool --chip esp32s3 merge_bin -o ../mininav-touch.bin \
            --flash_mode dio --flash_size 16MB --flash_freq 80m @flash_args && cd ..

      - name: Build non-touch version
        run: |
          . $IDF_PATH/export.sh
          rm -rf build sdkconfig
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.nontouch" build
          cd build && python3 -m esptool --chip esp32s3 merge_bin -o ../mininav-nontouch.bin \
            --flash_mode dio --flash_size 16MB --flash_freq 80m @flash_args && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: mininav-firmware
          path: |
            mininav-touch.bin
            mininav-nontouch.bin
